name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test, Accessibility & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve native build dependencies
        run: pnpm approve-builds --all

      - name: Build shared package
        run: pnpm --filter @triattendance/shared build

      - name: Run unit & accessibility tests
        run: pnpm test

      - name: Run web accessibility audit
        run: pnpm --filter @triattendance/web test:a11y

      - name: Build Web Application
        run: pnpm --filter @triattendance/web build

      - name: Build API Service
        run: pnpm --filter @triattendance/api build
